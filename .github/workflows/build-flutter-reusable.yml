name: Build Flutter APK (Smart Version Pool)

on:
  workflow_call:
    inputs:
      jobId:
        required: true
        type: string
      userId:
        required: true
        type: string
      payload:
        required: true
        type: string

env:
  FLUTTER_VERSION_POOL: |
    3.32.0
    3.32.5
    3.35.0
    3.38.0
    3.47.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 27

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          URL=$(echo '${{ inputs.payload }}' | jq -r '.zipAssetUrl')
          curl -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o project.zip "$URL"

          mkdir -p project

          unzip -qq project.zip -d project 2>/dev/null \
            || python3 -m zipfile -e project.zip project/ 2>/dev/null \
            || unzip project.zip -d project \
            || true

          chmod -R 755 project

          PUBSPEC=$(find project -type f -iname "pubspec.yaml" | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml tidak ditemukan di dalam ZIP"
            ls -la project/
            exit 1
          fi

          PROJECT_ROOT=$(cd "$(dirname "$PUBSPEC")" && pwd)
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          echo "Proyek ditemukan di: $PROJECT_ROOT"
          echo "Struktur:"
          ls -la "$PROJECT_ROOT/" | head -15

      - name: Clean Stale Build Cache
        run: |
          TARGET_DIR="${{ env.PROJECT_ROOT }}"
          if [ -d "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            rm -rf build .dart_tool android/.gradle android/build android/app/build ios/Pods ios/.symlinks
            find . -iname "local.properties" -delete
          else
            echo "Error: Direktori $TARGET_DIR tidak ditemukan."
            exit 1
          fi

      - name: Fix Android SDK Path
        run: echo "sdk.dir=$ANDROID_HOME" > "${{ env.PROJECT_ROOT }}/android/local.properties"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and SDK Platforms
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME "cmdline-tools;latest" 2>&1 | tail -3 || true

          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "ndk;27.0.12077973" \
            "ndk;28.2.13676358" \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "platforms;android-36" 2>&1 | tail -5 || true

          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "platforms;android-37" 2>&1 | tail -3 || true

          echo "=== SDK Platforms tersedia ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "(tidak ada)"

      - name: Detect Min SDK Requirement
        id: detect_sdk
        env:
          PUBSPEC_PATH: ${{ env.PROJECT_ROOT }}/pubspec.yaml
        run: |
          MIN_SDK=$(python3 << 'PYEOF'
          import re
          import sys
          import os

          pubspec_path = os.environ.get('PUBSPEC_PATH')

          try:
              with open(pubspec_path) as f:
                  content = f.read()

              in_env = False
              for line in content.split('\n'):
                  if re.match(r'^environment\s*:', line):
                      in_env = True
                      continue
                  if in_env:
                      if line and not line[0].isspace() and not line.startswith('#'):
                          break
                      m = re.match(r'^\s+sdk\s*:\s*["\']?[>=^~\s]*(\d+\.\d+)', line)
                      if m:
                          print(m.group(1))
                          sys.exit(0)

              print("3.8")
          except Exception as e:
              print("3.8")
          PYEOF
          )

          echo "min_sdk=$MIN_SDK" >> $GITHUB_OUTPUT
          echo "Detected min SDK: $MIN_SDK"

      - name: Select Compatible Flutter Versions
        id: select_versions
        env:
          MIN_SDK: ${{ steps.detect_sdk.outputs.min_sdk }}
        run: |
          CANDIDATES=$(python3 << 'PYEOF'
          import os

          min_sdk = os.environ.get('MIN_SDK', '3.8')
          pool = ["3.32.0", "3.32.5", "3.35.0", "3.38.0", "3.47.0"]

          compat_map = {
              "3.8": ["3.32.0", "3.32.5", "3.35.0", "3.38.0"],
              "3.9": ["3.32.5", "3.35.0", "3.38.0"],
              "3.10": ["3.35.0", "3.38.0"],
              "3.11": ["3.38.0"],
              "3.12": ["3.47.0"],
              "3.13": ["3.47.0"],
          }

          candidates = compat_map.get(min_sdk, ["3.47.0"])
          print(" ".join(candidates))
          PYEOF
          )

          echo "candidates=$CANDIDATES" >> $GITHUB_OUTPUT
          echo "FLUTTER_CANDIDATES=$CANDIDATES" >> $GITHUB_ENV
          echo "Selected Flutter versions: $CANDIDATES"

      - name: Auto-Detect & Patch compileSdk
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          PROJECT_SDK=0
          GRADLE_FILE=""
          for f in "android/app/build.gradle.kts" "android/app/build.gradle"; do
            if [ -f "$f" ]; then
              SDK=$(grep -E "compileSdk" "$f" 2>/dev/null | grep -oE '[0-9]{2,}' | sort -n | tail -1 || echo "0")
              [ -n "$SDK" ] && [ "$SDK" -gt 0 ] && PROJECT_SDK=$SDK && GRADLE_FILE="$f"
              break
            fi
          done
          echo "Project compileSdk: $PROJECT_SDK"

          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          PLUGIN_SDK=$(find "$PUB_CACHE_DIR" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            2>/dev/null | xargs grep -h "compileSdk" 2>/dev/null \
            | grep -oE '[0-9]{2,}' | sort -n | tail -1 || echo "0")
          echo "Highest compileSdk dari plugins: $PLUGIN_SDK"

          REQUIRED_SDK=$PROJECT_SDK
          [ -n "$PLUGIN_SDK" ] && [ "$PLUGIN_SDK" -gt "$REQUIRED_SDK" ] 2>/dev/null && REQUIRED_SDK=$PLUGIN_SDK
          [ -z "$REQUIRED_SDK" ] || [ "$REQUIRED_SDK" -lt 35 ] && REQUIRED_SDK=35

          echo "Required SDK: $REQUIRED_SDK"

          if [ ! -d "$ANDROID_HOME/platforms/android-$REQUIRED_SDK" ]; then
            echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
              "platforms;android-$REQUIRED_SDK" --sdk_root=$ANDROID_HOME 2>&1 | tail -5 || true
          fi

          if [ -n "$GRADLE_FILE" ] && [ "$REQUIRED_SDK" -gt "$PROJECT_SDK" ]; then
            if [ -d "$ANDROID_HOME/platforms/android-$REQUIRED_SDK" ]; then
              echo "Patching $GRADLE_FILE: compileSdk $PROJECT_SDK -> $REQUIRED_SDK"
              python3 - "$GRADLE_FILE" "$PROJECT_SDK" "$REQUIRED_SDK" <<'PYEOF'
          import sys, re
          gradle_file, old_sdk, new_sdk = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(gradle_file) as f:
              content = f.read()
          p = re.sub(r'(compileSdk(?:Version)?\s*(?:=\s*)?)' + re.escape(old_sdk),
                     lambda m: m.group(1) + new_sdk, content)
          p = re.sub(r'(targetSdk(?:Version)?\s*(?:=\s*)?)' + re.escape(old_sdk),
                     lambda m: m.group(1) + new_sdk, p)
          with open(gradle_file, 'w') as f:
              f.write(p)
          print(f"Done: compileSdk/targetSdk {old_sdk} -> {new_sdk}")
          PYEOF
              grep -E "compileSdk|targetSdk" "$GRADLE_FILE"
            else
              echo "SDK $REQUIRED_SDK tidak tersedia, skip patch. Recovery build yang akan handle."
            fi
          else
            echo "Tidak perlu patch compileSdk."
          fi

      - name: Tune JVM Memory untuk Gradle
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          mkdir -p android
          touch android/gradle.properties
          sed -i '/org.gradle.jvmargs/d' android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          grep -q "org.gradle.daemon" android/gradle.properties || \
            echo "org.gradle.daemon=true" >> android/gradle.properties

      - name: Setup Initial Flutter and FVM
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true

      - name: Install FVM for Version Switching
        run: |
          dart pub global activate fvm
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm releases

      - name: Build with Flutter Version Pool Retry
        id: build_retry
        timeout-minutes: 25
        run: |
          set +e

          PROJECT_ROOT="${{ env.PROJECT_ROOT }}"
          CANDIDATES="${{ env.FLUTTER_CANDIDATES }}"
          ATTEMPT=0
          SUCCESS=false
          FLUTTER_VERSION_USED=""
          FA_VERSION_USED=""
          MAX_SDK_CEILING=36
          APPLY_PH_OVERRIDE=false

          export PATH="$PATH:$HOME/.pub-cache/bin"

          pin_fa_version() {
            local FA_VER="$1"
            python3 - "$FA_VER" <<'PYEOF'
          import re, sys, os

          fa_ver = sys.argv[1]
          pubspec_path = "pubspec.yaml"
          if not os.path.exists(pubspec_path):
              sys.exit(0)

          with open(pubspec_path) as f:
              content = f.read()

          pattern = re.compile(r'^(\s*font_awesome_flutter\s*:\s*).*$', re.M)

          if pattern.search(content):
              content = pattern.sub(lambda m: m.group(1) + '"^' + fa_ver + '"', content, count=1)
          else:
              content = re.sub(
                  r'(dependencies:\s*\n)',
                  r'\1  font_awesome_flutter: "^' + fa_ver + '"\n',
                  content,
                  count=1
              )

          with open(pubspec_path, 'w') as f:
              f.write(content)

          print(f"Pinned font_awesome_flutter to ^{fa_ver}")
          PYEOF
          }

          pin_safe_overrides() {
            python3 <<'PYEOF'
          import re, os

          pubspec_path = "pubspec.yaml"
          if not os.path.exists(pubspec_path):
              exit(0)

          with open(pubspec_path) as f:
              content = f.read()

          overrides_to_add = {
              'permission_handler_android': '"<13.0.0"',
          }

          if 'dependency_overrides:' not in content:
              entries = ''.join(f'  {k}: {v}\n' for k, v in overrides_to_add.items())
              content = content.rstrip() + '\n\ndependency_overrides:\n' + entries
          else:
              for pkg, ver in overrides_to_add.items():
                  if re.search(rf'^\s+{re.escape(pkg)}\s*:', content, re.M):
                      content = re.sub(
                          rf'(^\s*{re.escape(pkg)}\s*:\s*).*$',
                          rf'\1{ver}',
                          content,
                          count=1,
                          flags=re.M
                      )
                  else:
                      content = re.sub(
                          r'(dependency_overrides:\s*\n)',
                          f'\\1  {pkg}: {ver}\n',
                          content
                      )

          with open(pubspec_path, 'w') as f:
              f.write(content)

          print("Pinned permission_handler_android to <13.0.0")
          PYEOF
          }

          patch_compile_sdk() {
            local NEW_SDK="$1"
            for path in "android/app/build.gradle.kts" "android/app/build.gradle"; do
              [ -f "$path" ] || continue
              python3 - "$path" "$NEW_SDK" <<'PYEOF'
          import re, sys
          gradle_file, new_sdk = sys.argv[1], sys.argv[2]
          with open(gradle_file) as f:
              content = f.read()
          m = re.search(r'compileSdk(?:Version)?\s*(?:=\s*)?(\d+)', content)
          if m:
              old = m.group(1)
              if int(new_sdk) > int(old):
                  p = re.sub(r'(compileSdk(?:Version)?\s*(?:=\s*)?)' + re.escape(old),
                             lambda x: x.group(1) + new_sdk, content)
                  p = re.sub(r'(targetSdk(?:Version)?\s*(?:=\s*)?)' + re.escape(old),
                             lambda x: x.group(1) + new_sdk, p)
                  with open(gradle_file, 'w') as f:
                      f.write(p)
                  print(f"Patched {gradle_file}: compileSdk/targetSdk {old} -> {new_sdk}")
              else:
                  print(f"compileSdk {old} sudah >= {new_sdk}, skip")
          PYEOF
              break
            done
          }

          fix_sdk() {
            local LOG="$1"
            local LOG_COMPILE LOG_MISSING TARGET

            LOG_COMPILE=$(grep -oE "compiles against Android SDK [0-9]+" "$LOG" 2>/dev/null \
              | grep -oE "[0-9]+" | sort -n | tail -1 || true)
            LOG_MISSING=$(grep -oE "platforms;android-[0-9]+" "$LOG" 2>/dev/null \
              | grep -oE "[0-9]+" | sort -n | tail -1 || true)

            TARGET=0
            for v in "$LOG_COMPILE" "$LOG_MISSING"; do
              [ -n "$v" ] && [ "$v" -gt "$TARGET" ] 2>/dev/null && TARGET="$v"
            done

            [ "$TARGET" -le 0 ] && return 1

            echo "SDK fix: dibutuhkan platforms;android-$TARGET"

            if [ -d "$ANDROID_HOME/platforms/android-$TARGET" ]; then
              echo "SDK $TARGET sudah ada, hanya patch compileSdk"
              patch_compile_sdk "$TARGET"
              return 0
            fi

            if [ "$TARGET" -gt "$MAX_SDK_CEILING" ]; then
              echo "SDK $TARGET melebihi batas aman ($MAX_SDK_CEILING) di runner ini, skip install dan langsung downgrade package via dependency_overrides..."
            else
              echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
                "platforms;android-$TARGET" --sdk_root=$ANDROID_HOME 2>&1 | tail -5 || true

              if [ -d "$ANDROID_HOME/platforms/android-$TARGET" ]; then
                echo "SDK $TARGET berhasil ter-install"
                patch_compile_sdk "$TARGET"
                return 0
              fi

              echo "SDK $TARGET tidak tersedia via sdkmanager, downgrade packages via dependency_overrides..."
            fi
            MAX_AVAIL=$(ls "$ANDROID_HOME/platforms/" 2>/dev/null \
              | grep -oE 'android-[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1 || echo "36")
            echo "Max SDK tersedia: $MAX_AVAIL"

            python3 - "$TARGET" "$MAX_AVAIL" "${PUB_CACHE:-$HOME/.pub-cache}" "$(pwd)" <<'DOWNGRADE_PYEOF'
          import sys, os, re

          target_sdk = int(sys.argv[1])
          max_avail  = int(sys.argv[2])
          pub_cache  = sys.argv[3]
          project    = sys.argv[4]

          hosted = os.path.join(pub_cache, 'hosted', 'pub.dev')
          if not os.path.isdir(hosted):
              print("pub-cache tidak ditemukan, skip")
              sys.exit(0)

          def ver_tuple(v):
              try:
                  return tuple(int(p) for p in re.split(r'[.+]', v)[:3])
              except:
                  return (0, 0, 0)

          bad_pkgs = set()
          for d in os.listdir(hosted):
              pkg_dir = os.path.join(hosted, d)
              for grad in ('android/build.gradle', 'android/build.gradle.kts'):
                  fpath = os.path.join(pkg_dir, grad)
                  if not os.path.exists(fpath):
                      continue
                  content = open(fpath).read()
                  sdks = re.findall(r'compileSdk\w*\s*(?:=\s*)?(\d+)', content)
                  if any(int(s) >= target_sdk for s in sdks):
                      pkg_name = re.sub(r'-[\d][.\d+]*$', '', d)
                      bad_pkgs.add(pkg_name)
                  break

          if not bad_pkgs:
              print(f"Tidak ada package di pub-cache yang butuh SDK >= {target_sdk}")
              sys.exit(0)

          print(f"Packages butuh SDK >= {target_sdk}: {bad_pkgs}")

          parent_data = {}
          for d in os.listdir(hosted):
              pkg_name = re.sub(r'-[\d][.\d+]*$', '', d)
              if pkg_name in bad_pkgs:
                  continue
              pubspec_path = os.path.join(hosted, d, 'pubspec.yaml')
              if not os.path.exists(pubspec_path):
                  continue
              content = open(pubspec_path).read()
              depends_on_bad = any(
                  re.search(rf'^\s+{re.escape(bp)}\s*:', content, re.M)
                  for bp in bad_pkgs
              )
              ver_m = re.search(r'^version:\s*([^\s]+)', content, re.M)
              ver = ver_m.group(1).strip() if ver_m else '0.0.0'

              if pkg_name not in parent_data:
                  parent_data[pkg_name] = {'bad': [], 'safe': []}
              if depends_on_bad:
                  parent_data[pkg_name]['bad'].append(ver)
              else:
                  parent_data[pkg_name]['safe'].append(ver)

          overrides = {}
          pubspec_path = os.path.join(project, 'pubspec.yaml')
          user_deps = set()
          if os.path.exists(pubspec_path):
              uc = open(pubspec_path).read()
              for bp in bad_pkgs:
                  if re.search(rf'^\s+{re.escape(bp)}\s*:', uc, re.M):
                      user_deps.add(bp)

          to_check = user_deps | set(parent_data.keys())
          for pkg in to_check:
              data = parent_data.get(pkg, {'bad': [], 'safe': []})
              if not data['bad'] and pkg not in bad_pkgs:
                  continue
              if data['safe']:
                  best = max(data['safe'], key=ver_tuple)
                  overrides[pkg] = best
              else:
                  all_bad = data['bad']
                  if all_bad:
                      lowest_bad = min(all_bad, key=ver_tuple)
                      overrides[pkg] = f'"<{lowest_bad}"'

          if not overrides:
              print("Tidak ada override yang bisa diterapkan")
              sys.exit(0)

          print(f"Dependency overrides: {overrides}")

          if not os.path.exists(pubspec_path):
              sys.exit(0)

          with open(pubspec_path) as f:
              uc = f.read()

          new_entries = ''.join(f'  {pkg}: {ver}\n' for pkg, ver in overrides.items())
          if 'dependency_overrides:' not in uc:
              uc = uc.rstrip() + '\n\ndependency_overrides:\n' + new_entries
          else:
              for pkg, ver in overrides.items():
                  if not re.search(rf'^\s+{re.escape(pkg)}\s*:', uc, re.M):
                      uc = re.sub(r'(dependency_overrides:\s*\n)',
                                  f'\\1  {pkg}: {ver}\n', uc)

          with open(pubspec_path, 'w') as f:
              f.write(uc)

          print(f"pubspec.yaml diupdate dengan {len(overrides)} dependency_overrides")
          DOWNGRADE_PYEOF

            fvm flutter pub get || true
            return 0
          }

          for FLUTTER_VER in $CANDIDATES; do
            ATTEMPT=$((ATTEMPT + 1))
            TOTAL=$(echo $CANDIDATES | wc -w)

            echo ""
            echo "════════════════════════════════════════════"
            echo "Attempt $ATTEMPT/$TOTAL - Flutter $FLUTTER_VER"
            echo "════════════════════════════════════════════"

            cd "$PROJECT_ROOT"

            fvm install $FLUTTER_VER 2>&1 | tail -5
            fvm use $FLUTTER_VER --force 2>&1 | tail -3
            fvm flutter --version

            if [ "$ATTEMPT" -gt 1 ]; then
              rm -rf build .dart_tool android/build android/app/build
              fvm flutter clean 2>/dev/null || true
            fi

            FA_VERSIONS_TO_TRY="ORIGINAL 10.9.0 10.9.1 11.0.0"

            for FA_VER in $FA_VERSIONS_TO_TRY; do
              echo ""
              if [ "$FA_VER" = "ORIGINAL" ]; then
                echo "-- Flutter $FLUTTER_VER + font_awesome_flutter (versi asli project, tidak diubah) --"
              else
                echo "-- Flutter $FLUTTER_VER + font_awesome_flutter $FA_VER --"
                pin_fa_version "$FA_VER"
              fi

              if [ "$APPLY_PH_OVERRIDE" = true ]; then
                pin_safe_overrides
              fi

              PUB_LOG=$(mktemp)
              if ! fvm flutter pub get 2>&1 | tee "$PUB_LOG"; then
                echo "flutter pub get gagal, coba versi berikutnya..."
                continue
              fi

              BUILD_LOG=$(mktemp)
              fvm flutter build apk --release --no-tree-shake-icons \
                --android-skip-build-dependency-validation 2>&1 | tee "$BUILD_LOG"
              BUILD_EXIT=${PIPESTATUS[0]}

              if [ $BUILD_EXIT -eq 0 ]; then
                echo "✅ BUILD BERHASIL dengan Flutter $FLUTTER_VER + font_awesome_flutter $FA_VER"
                SUCCESS=true
                FLUTTER_VERSION_USED="$FLUTTER_VER"
                FA_VERSION_USED="$FA_VER"
                break
              fi

              if [ "$APPLY_PH_OVERRIDE" != true ]; then
                PH_SDK_ERR=$(grep -cE "permission_handler_android requires Android SDK|permission_handler_android:compileRelease.*Platform SDK" \
                  "$BUILD_LOG" || true)
                if [ "${PH_SDK_ERR:-0}" -gt 0 ]; then
                  echo "permission_handler_android minta SDK yang gak ada di runner, apply override khusus untuk itu..."
                  APPLY_PH_OVERRIDE=true
                  pin_safe_overrides
                  fvm flutter pub get 2>&1 | tee "$PUB_LOG"
                  fvm flutter build apk --release --no-tree-shake-icons \
                    --android-skip-build-dependency-validation 2>&1 | tee "$BUILD_LOG"
                  BUILD_EXIT=${PIPESTATUS[0]}

                  if [ $BUILD_EXIT -eq 0 ]; then
                    echo "✅ BUILD BERHASIL setelah override permission_handler_android"
                    SUCCESS=true
                    FLUTTER_VERSION_USED="$FLUTTER_VER"
                    FA_VERSION_USED="$FA_VER"
                    break
                  fi
                fi
              fi

              REQ_MIN=$(grep -oE "cannot be smaller than version [0-9]+" "$BUILD_LOG" \
                | grep -oE "[0-9]+" | head -1)
              if [ -n "$REQ_MIN" ]; then
                echo "Auto-patch minSdk -> $REQ_MIN"
                python3 - "$REQ_MIN" <<'PYEOF'
          import re, os, sys
          req = sys.argv[1]
          for path in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if not os.path.exists(path): continue
              with open(path) as f: content = f.read()
              nc = re.sub(r'(minSdk(?:Version)?\s*=?\s*)(flutter\.minSdkVersion|\d+)',
                          lambda m: m.group(1) + req, content)
              if nc != content:
                  with open(path, 'w') as f: f.write(nc)
                  print(f"Patched: minSdk -> {req}")
              break
          PYEOF
                fvm flutter build apk --release --no-tree-shake-icons \
                  --android-skip-build-dependency-validation 2>&1 | tee "$BUILD_LOG"
                BUILD_EXIT=${PIPESTATUS[0]}

                if [ $BUILD_EXIT -eq 0 ]; then
                  echo "✅ BUILD BERHASIL setelah minSdk patch"
                  SUCCESS=true
                  FLUTTER_VERSION_USED="$FLUTTER_VER"
                  FA_VERSION_USED="$FA_VER"
                  break
                fi
              fi

              HAS_SDK_ERR=$(grep -cE "Failed to find Platform SDK|compiles against Android SDK [0-9]+" \
                "$BUILD_LOG" || true)
              if [ "${HAS_SDK_ERR:-0}" -gt 0 ]; then
                echo "Detected SDK error, attempting auto-fix..."
                fix_sdk "$BUILD_LOG"
                fvm flutter build apk --release --no-tree-shake-icons \
                  --android-skip-build-dependency-validation 2>&1 | tee "$BUILD_LOG"
                BUILD_EXIT=${PIPESTATUS[0]}

                if [ $BUILD_EXIT -eq 0 ]; then
                  echo "✅ BUILD BERHASIL setelah SDK fix"
                  SUCCESS=true
                  FLUTTER_VERSION_USED="$FLUTTER_VER"
                  FA_VERSION_USED="$FA_VER"
                  break
                fi
              fi

              INCOMPAT=$(grep -cE "can't be (extended|implemented|mixed in) outside of its library|Error: The (method|getter|setter|class|argument) .* (isn't defined|can't be)" \
                "$BUILD_LOG" || true)
              if [ "${INCOMPAT:-0}" -gt 0 ]; then
                echo "Incompatibility terdeteksi, flutter pub upgrade..."
                fvm flutter pub upgrade
                fix_sdk "$BUILD_LOG" || true
                fvm flutter build apk --release --no-tree-shake-icons \
                  --android-skip-build-dependency-validation 2>&1 | tee "$BUILD_LOG"
                BUILD_EXIT=${PIPESTATUS[0]}

                if [ $BUILD_EXIT -eq 0 ]; then
                  echo "✅ BUILD BERHASIL setelah pub upgrade"
                  SUCCESS=true
                  FLUTTER_VERSION_USED="$FLUTTER_VER"
                  FA_VERSION_USED="$FA_VER"
                  break
                fi
              fi

              HAS_SDK_ERR2=$(grep -cE "Failed to find Platform SDK|compiles against Android SDK [0-9]+" \
                "$BUILD_LOG" || true)
              if [ "${HAS_SDK_ERR2:-0}" -gt 0 ]; then
                echo "SDK error catch-all setelah upgrade..."
                fix_sdk "$BUILD_LOG" || true
                fvm flutter build apk --release --no-tree-shake-icons \
                  --android-skip-build-dependency-validation 2>&1 | tee "$BUILD_LOG"
                BUILD_EXIT=${PIPESTATUS[0]}

                if [ $BUILD_EXIT -eq 0 ]; then
                  echo "✅ BUILD BERHASIL setelah SDK catch-all"
                  SUCCESS=true
                  FLUTTER_VERSION_USED="$FLUTTER_VER"
                  FA_VERSION_USED="$FA_VER"
                  break
                fi
              fi

              if grep -q "OutOfMemoryError" "$BUILD_LOG" 2>/dev/null; then
                echo "OOM terdeteksi, disable parallel build dan naikkan memory..."
                echo "org.gradle.parallel=false" >> android/gradle.properties
                echo "org.gradle.workers.max=2" >> android/gradle.properties
                echo "org.gradle.configureondemand=false" >> android/gradle.properties
                sed -i '/org.gradle.jvmargs/d' android/gradle.properties
                echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=3g -XX:+UseG1GC" >> android/gradle.properties
                fvm flutter build apk --release --no-tree-shake-icons \
                  --android-skip-build-dependency-validation 2>&1 | tee "$BUILD_LOG"
                BUILD_EXIT=${PIPESTATUS[0]}

                if [ $BUILD_EXIT -eq 0 ]; then
                  echo "✅ BUILD BERHASIL setelah OOM fix"
                  SUCCESS=true
                  FLUTTER_VERSION_USED="$FLUTTER_VER"
                  FA_VERSION_USED="$FA_VER"
                  break
                fi
              fi

              KOTLIN_ERR=$(grep -cE "Unresolved reference.*compilerOptions|kotlin\s*\{.*Unresolved|compilerOptions.*Unresolved" \
                "$BUILD_LOG" 2>/dev/null || true)
              if [ "${KOTLIN_ERR:-0}" -gt 0 ]; then
                echo "Kotlin DSL version error terdeteksi, injecting dependency_overrides..."
                python3 - "$(pwd)" <<'KOTLIN_PYEOF'
          import re, sys, os

          project = sys.argv[1]
          pubspec_path = os.path.join(project, 'pubspec.yaml')
          if not os.path.exists(pubspec_path):
              sys.exit(0)

          with open(pubspec_path) as f:
              content = f.read()

          overrides_to_add = {
              'permission_handler_android': '"<13.0.0"',
          }

          if 'dependency_overrides:' not in content:
              entries = ''.join(f'  {k}: {v}\n' for k, v in overrides_to_add.items())
              content = content.rstrip() + '\n\ndependency_overrides:\n' + entries
          else:
              for pkg, ver in overrides_to_add.items():
                  if not re.search(rf'^\s+{re.escape(pkg)}\s*:', content, re.M):
                      content = re.sub(
                          r'(dependency_overrides:\s*\n)',
                          f'\\1  {pkg}: {ver}\n',
                          content
                      )

          with open(pubspec_path, 'w') as f:
              f.write(content)

          print(f"Injected dependency_overrides: {list(overrides_to_add.keys())}")
          KOTLIN_PYEOF

                fvm flutter pub get 2>/dev/null || true
                fvm flutter build apk --release --no-tree-shake-icons \
                  --android-skip-build-dependency-validation 2>&1 | tee "$BUILD_LOG"
                BUILD_EXIT=${PIPESTATUS[0]}

                if [ $BUILD_EXIT -eq 0 ]; then
                  echo "✅ BUILD BERHASIL setelah Kotlin DSL fix"
                  SUCCESS=true
                  FLUTTER_VERSION_USED="$FLUTTER_VER"
                  FA_VERSION_USED="$FA_VER"
                  break
                fi
              fi

              echo "❌ BUILD GAGAL dengan Flutter $FLUTTER_VER + font_awesome_flutter $FA_VER"
              echo "-- Ringkasan error compile Dart (lib/*.dart) --"
              grep -E "^lib/.*Error:" "$BUILD_LOG" | head -15 || echo "(tidak ada error compile Dart spesifik, cek log lengkap di atas)"
              ERROR_MSG=$(tail -20 "$BUILD_LOG" | grep -E "Error:|FAILURE:" | head -1)
              echo "Error: $ERROR_MSG"
            done

            if [ "$SUCCESS" = true ]; then
              break
            fi

            echo "❌ BUILD GAGAL dengan Flutter $FLUTTER_VER (semua versi font_awesome_flutter dicoba)"
            echo "Trying next Flutter version..."
          done

          if [ "$SUCCESS" = false ]; then
            echo ""
            echo "❌ SEMUA VERSI FLUTTER DI POOL SUDAH DICOBA - BUILD TETAP GAGAL"
            echo "Versi yang dicoba: $CANDIDATES"
            exit 1
          fi

          echo "flutter_version_used=$FLUTTER_VERSION_USED" >> $GITHUB_OUTPUT
          echo "fa_version_used=$FA_VERSION_USED" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        if: steps.build_retry.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Build Success Summary
        if: steps.build_retry.outcome == 'success'
        run: |
          echo "✅ BUILD BERHASIL"
          echo "Flutter Version: ${{ steps.build_retry.outputs.flutter_version_used }}"
          echo "font_awesome_flutter Version: ${{ steps.build_retry.outputs.fa_version_used }}"
          echo "APK Path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk"